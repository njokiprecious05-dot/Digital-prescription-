{% extends "base.html" %}{% block content %}
<h1>Audit log</h1>
<table>
  <tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr>
  {% for l in logs %}<tr><td>{{ l.created_at }}</td><td>{{ l.username or '—' }}</td><td>{{ l.action }}</td><td>{{ l.details or '' }}</td></tr>{% endfor %}
</table>
{% endblock %}
