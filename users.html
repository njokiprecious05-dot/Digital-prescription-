{% extends "base.html" %}{% block content %}
<h1>Staff accounts</h1>
<form method="post" class="card" data-validate>
  <div class="row">
    <div><label>Full name</label><input name="full_name" required></div>
    <div><label>Username</label><input name="username" required></div>
  </div>
  <div class="row">
    <div><label>Password</label><input type="password" name="password" minlength="6" required></div>
    <div><label>Role</label><select name="role">{% for r in roles %}<option>{{ r }}</option>{% endfor %}</select></div>
  </div>
  <p><button class="btn">Create account</button></p>
</form>
<table>
  <tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr>
  {% for u in users %}
  <tr><td>{{ u.full_name }}</td><td>{{ u.username }}</td><td>{{ u.role }}</td>
      <td>{{ 'Active' if u.active else 'Disabled' }}</td>
      <td><form method="post" action="{{ url_for('toggle_user', user_id=u.id) }}"><button class="btn light">{{ 'Disable' if u.active else 'Enable' }}</button></form></td></tr>
  {% endfor %}
</table>
{% endblock %}
