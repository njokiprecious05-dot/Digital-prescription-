{% extends "base.html" %}{% block content %}
<div class="card login">
  {% if role == 'doctor' %}<a class="back-link" href="{{ url_for('dashboard') }}" aria-label="Back to dashboard">&larr; Back to dashboard</a>{% endif %}
  <h1>Sign in</h1>
  <p class="muted">Digital Prescription Management System</p>
  <form method="post" data-validate>
    <label>Username</label><input name="username" required autofocus>
    <label>Password</label><input name="password" type="password" required>
    <p><button class="btn">Log in</button></p>
  </form>
  {% if role != 'doctor' %}<a class="doctor-link" href="{{ url_for('doctor_login') }}">&rarr; Doctor sign in</a>{% endif %}
  {% if role == 'doctor' %}<a class="doctor-link" href="{{ url_for('login') }}">&larr; Main sign in</a>{% endif %}
</div>
{% endblock %}
